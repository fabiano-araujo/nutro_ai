name: nutro_ai
description: "Nutro AI - Your intelligent nutrition assistant"
publish_to: 'none'
version: 1.0.5+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.4.8
  image_picker: ^1.0.7
  video_player: ^2.9.2
  file_picker: ^12.0.0-beta.7
  path_provider: ^2.1.4
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  provider: ^6.1.4
  http: ^1.1.0
  uuid: ^4.3.3
  intl: ^0.20.2
  youtube_explode_dart: ^3.1.0
  youtube_player_flutter: ^10.0.1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.0.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  flutter_tts: ^4.2.5
  google_mobile_ads: ^9.0.0
  
  # Substituir google_ml_kit completo por plugins específicos para reduzir tamanho
  # google_ml_kit: ^0.20.0
  google_mlkit_text_recognition: ^0.17.1
  
  permission_handler: ^13.0.0
  record: ^7.1.1
  flutter_math_fork: ^0.7.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.0.0
  camera: ^0.12.0+2
  image: ^4.1.6
  in_app_update: ^5.0.0
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  shimmer: ^4.0.0
  cached_network_image: ^4.0.0
  lottie: ^3.1.0

  # Firebase para notificacoes push
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  in_app_review: ^2.0.11
  firebase_app_check: ^0.4.4+1
  gal: ^2.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  mobile_scanner: ^7.2.0
  flutter_background_service: ^5.1.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#f6fae9"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  adaptive_icon_padding: 20
  
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/animations/
    - assets/fonts/
    - assets/images/
    - assets/link_test.txt
